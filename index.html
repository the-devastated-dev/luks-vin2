<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LÜKS-VIN 2.1</title>
<style>
body{margin:0;background:#080b10;color:#eef2f6;font:15px system-ui;padding:18px}main{max-width:1050px;margin:auto}.card{background:#111720;border:1px solid #283340;border-radius:16px;padding:16px;margin:12px 0}.row{display:flex;gap:10px;flex-wrap:wrap}input,select,button{padding:12px;border-radius:10px;border:1px solid #394655;background:#090d12;color:#fff}input{flex:1;min-width:220px}button{background:#d9b66b;color:#111;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fact{background:#0a0e13;padding:10px;border-radius:9px;margin:5px 0}.muted{color:#98a5b2}.ok{color:#5bdd91}.warn{color:#f1c263}.big{font-size:36px;font-weight:900}pre{white-space:pre-wrap;overflow:auto}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><main>
<h1>🚘 LÜKS-VIN 2.1</h1><p class="muted">VIN → canlı NHTSA/vPIC → katalog → araç sınıfı → ÖTV karar motoru</p>
<div class="card"><div class="row"><input id="vin" maxlength="17" placeholder="17 karakter VIN"><button onclick="run()">ANALİZ ET</button></div><p id="status">Hazır.</p></div>
<div id="out" class="hidden">
<div class="card"><h2 id="name">—</h2><div id="identity"></div></div>
<div class="grid"><div class="card"><h3>Teknik</h3><div id="tech"></div></div>
<div class="card"><h3>ÖTV Karar Motoru</h3><div id="tax"></div></div></div>
<div class="card"><h3>Karar / Güven</h3><div id="decision"></div></div>
<div class="card"><h3>Ham veri</h3><pre id="raw"></pre></div></div></main>
<script>
let cat={},rules={};let data=null;
const $=x=>document.getElementById(x);
async function load(){try{cat=await (await fetch("vehicles.json")).json();rules=await (await fetch("otv.json")).json()}catch(e){$("status").textContent="JSON dosyaları okunamadı: "+e.message}}
const first=(...x)=>x.find(v=>v!==undefined&&v!==null&&String(v).trim()&&v!=="Not Applicable");
const norm=v=>String(v||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
function fact(a,b){return `<div class="fact"><span class="muted">${a}</span><br><b>${b??"—"}</b></div>`}
function catalog(make,model){let k=Object.keys(cat).find(x=>x.toLowerCase()==String(make||"").toLowerCase());if(!k)return false;return Object.keys(cat[k]).some(x=>x.toLowerCase()==String(model||"").toLowerCase())}
function classify(d){
 let body=String(d.body||"").toLowerCase(),type=String(d.type||"").toLowerCase();
 let commercial=/panelvan|cargo|van|kamyonet|pickup|pick-up|commercial|truck/.test(body+" "+type);
 return commercial?"87.04":"87.03";
}
function otv(d){
 let cls=classify(d),cc=Number(d.cc||0),fuel=String(d.fuel||"").toLowerCase(),electric=/electric|elektrik/.test(fuel);
 if(cls=="87.04"){
   if(electric)return {rate:0.10,text:"%10",why:"87.04 elektrikli alt kuralı — GTİP alt kırılımı doğrulanmalı"};
   if(cc>4000)return {rate:.75,text:"%75",why:"87.04 >4000 cc"};
   if(cc>3000)return {rate:.52,text:"%52",why:"87.04 3001–4000 cc"};
   return {rate:.10,text:"%10",why:"87.04 ≤3000 cc"};
 }
 return {rate:null,text:"Otomatik oran için yeterli tarife verisi yok",why:"87.03'te güncel tarife; matrah + hacim + güç + elektrik/hybrid alt kırılımı birlikte değerlendirilmelidir"};
}
async function run(){
 let v=norm($("vin").value);$("vin").value=v;
 if(!/^[A-HJ-NPR-Z0-9]{17}$/.test(v)){ $("status").textContent="Geçerli 17 karakter VIN gir.";return}
 $("status").textContent="NHTSA vPIC sorgulanıyor…";
 let n=null;try{n=(await (await fetch("https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValuesExtended/"+v+"?format=json")).json()).Results?.[0]}catch(e){}
 if(!n){$("status").textContent="Canlı NHTSA verisi alınamadı.";return}
 data={make:first(n.Make),model:first(n.Model),year:first(n.ModelYear),body:first(n.BodyClass),type:first(n.VehicleType),fuel:first(n.FuelTypePrimary),cc:first(n.DisplacementCC),hp:first(n.EngineHP),trans:first(n.TransmissionStyle),drive:first(n.DriveType),plant:first(n.PlantCountry)};
 let c=catalog(data.make,data.model),t=otv(data);
 $("out").classList.remove("hidden");$("name").textContent=[data.make,data.model,data.year].filter(Boolean).join(" ")||"Araç";
 $("identity").innerHTML=[fact("VIN",v),fact("Marka",data.make),fact("Model",data.model),fact("Yıl",data.year),fact("Kasa",data.body),fact("Araç tipi",data.type),fact("Üretim ülkesi",data.plant)].join("");
 $("tech").innerHTML=[fact("Motor hacmi",data.cc?data.cc+" cc":"—"),fact("Güç",data.hp?data.hp+" hp":"—"),fact("Yakıt",data.fuel),fact("Şanzıman",data.trans),fact("Çekiş",data.drive)].join("");
 $("tax").innerHTML=[fact("Tespit edilen sınıf",t?classify(data):"—"),fact("ÖTV oranı",t.text),fact("Gerekçe",t.why),fact("Katalog eşleşmesi",c?"Evet":"Hayır")].join("");
 $("decision").innerHTML=`<b>Veri güveni:</b> ${c?"Canlı VIN + katalog":"Canlı VIN"}<br><br>`+(t.rate===null?'<span class="warn">⚠ 87.03 için oran uydurulmadı. Güncel resmî tarife alt kırılımı gerekir.</span>':'<span class="ok">✓ Ticari/87.04 kuralı uygulandı; yine GTİP alt kırılımı teyit edilmelidir.</span>');
 $("raw").textContent=JSON.stringify(n,null,2);$("status").textContent="Analiz tamamlandı.";
}
load();
</script></body></html>
